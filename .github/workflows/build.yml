name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to publish Releases on tags

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. ipatool.exe (Python CLI -> single exe) ----------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ipatool.exe (PyInstaller)
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt
          pyinstaller --onefile --name ipatool -p . --collect-all cryptography run.py
          if not exist dist\ipatool.exe exit /b 1

      # ---------- 2. zsign.exe (MSBuild on the bundled VS2022 solution) ----------
      # zsign ships static OpenSSL + /MT static CRT, so the exe is standalone (no DLLs).
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build zsign (MSBuild, static x64)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/zhlynn/zsign.git zsign-src
          msbuild zsign-src\build\windows\vs2022\zsign.sln /p:Configuration=Release /p:Platform=x64 /m /nologo
          $exe = Get-ChildItem -Path zsign-src -Recurse -Filter zsign.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "zsign.exe not found after build"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          Copy-Item $exe.FullName dist\bin\zsign.exe -Force
          Write-Host "zsign built: $($exe.FullName)"
          & dist\bin\zsign.exe -v

      # ---------- 3. assemble + package ----------
      - name: Assemble release
        shell: cmd
        run: |
          mkdir release
          copy dist\ipatool.exe release\
          xcopy /E /I /Y dist\bin release\bin
          copy README.md release\
          copy LICENSE release\

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath ipatool-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-windows-x64
          path: ipatool-windows-x64.zip

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ipatool-windows-x64.zip
