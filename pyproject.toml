[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipatool-multitool"
version = "0.1.0"
description = "Windows-friendly IPA signing & inspection multitool (re-sign, inspect/pull certs & profiles, install)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["cryptography>=42.0"]

[project.scripts]
ipatool = "ipatool.cli:main"

[tool.setuptools]
packages = ["ipatool"]
